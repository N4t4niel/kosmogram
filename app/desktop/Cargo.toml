[package]
name = "kosmogram"
version = "1.0.0"
edition = "2021"
license = "GPL-2.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
chrono = "0.4"
astro-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
